name: Bug or installation question
description: Report a problem with ChatGPT SEO's Codex or ChatGPT edition
title: '[Issue]: '
body:
  - type: markdown
    attributes:
      value: Do not post private exports, transcripts, credentials, exploit details, or personal data. Use a short redacted example. For vulnerabilities, follow SECURITY.md.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Full Codex edition (codex-seo)
        - Regular ChatGPT companion (SEO-pro)
        - Documentation or packaging
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version, operating system, and host
      placeholder: codex-seo 0.1.0, Windows, Codex desktop
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Short redacted prompt, command, and reproduction steps
    validations:
      required: true
  - type: textarea
    id: readiness
    attributes:
      label: Runtime and provider availability, if relevant
      description: Include redacted doctor output or identify an unavailable tool. Never paste keys or tokens.
