name: Package checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python tools/validate_plugin.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_plugin.py --check-downloads
  codex-execution:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r plugins/codex-seo/requirements.txt -r plugins/codex-seo/requirements-dev.txt
      - run: python tools/port_codex_workflows.py --check
      - run: python tools/codex_port.py --generate
      - run: python tools/run_codex_regressions.py
      - run: python tools/codex_port.py --build
